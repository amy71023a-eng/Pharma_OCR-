services:
  review:
    image: pharma-review:local
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:8080"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OCR_LANG: ${OCR_LANG:-eng}
    volumes:
      - review-output:/app/output
      - ./knowledge:/app/knowledge:ro
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
volumes:
  review-output:
