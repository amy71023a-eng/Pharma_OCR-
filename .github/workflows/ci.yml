name: docker-ocr-rag-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p evidence
      - name: Build the same image used locally
        run: docker compose build
      - name: Unit and actual OCR integration tests
        run: docker compose run --rm review python -m pytest -v --junitxml=/app/output/junit-v2.xml
      - name: Start and validate running container
        run: |
          docker compose up -d --wait
          docker compose exec -T review python scripts/container_check.py
          docker compose exec -T review python etl.py examples/records.json --db output/ci.sqlite
      - name: Dependency audit and SBOM
        run: |
          docker compose exec -T review python -m pip_audit -r requirements.txt -f json -o output/audit-v2.json
          docker compose exec -T review cyclonedx-py requirements requirements.txt -o output/sbom-v2.cdx.json
      - name: Collect evidence even on failure
        if: always()
        run: |
          docker compose logs --no-color > evidence/docker.log
          docker compose cp review:/app/output/. evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: evidence/
      - if: always()
        run: docker compose down
